syntax = "proto3";

package auth;

service AuthService {
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);
  rpc RegisterCompany (RegisterCompanyRequest) returns (RegisterCompanyResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}


message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string fullName = 4;
  string role = 6;
  string accountType = 7;
  string phone = 8;
  string city = 9;
  string createdAt = 10;
  string updatedAt = 11;
  string deletedAt = 12;
}

message Company {
  string id = 1;
  User owner = 2;
  string bin = 3;
  string kbe = 4;
  string registeredAddress = 5;
  string emailAddress = 6;
  int32 postcode = 7;
  string iik = 8;
  string bik = 9;
  string createdAt = 10;
  string updatedAt = 11;
  string deletedAt = 12;
}


message RegisterUserRequest {
  string email = 1;
  string username = 2;
  string fullName = 3;
  string city = 4;
  string phone = 5;
  string password = 6;
  string confirmPassword = 7;
}

message RegisterUserResponse {
  User user = 1;
}


message RegisterCompanyRequest {
  string ownerId = 1;
  string bin = 2;
  string kbe = 3;
  string registeredAddress = 4;
  string emailAddress = 5;
  int32 postcode = 6;
  string iik = 7;
  string bik = 8;
}

message RegisterCompanyResponse {
  Company company = 1;
}


message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
}
